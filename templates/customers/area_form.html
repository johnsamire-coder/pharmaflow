{% extends "core/base.html" %}
{% block title %}المنطقة{% endblock %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h3 class="mb-4">{% if object %}تعديل منطقة{% else %}منطقة جديدة{% endif %}</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3"><label class="form-label">اسم المنطقة</label>{{ form.area_name }}</div>
            <div class="mb-3"><label class="form-label">المدينة</label>{{ form.city }}</div>
            <div class="form-check mb-3">{{ form.is_active }}<label class="form-check-label">فعال</label></div>
            <button class="btn btn-primary">حفظ</button>
            <a href="{% url 'customers:area_list' %}" class="btn btn-light">إلغاء</a>
        </form>
    </div>
</div>
{% endblock %}
