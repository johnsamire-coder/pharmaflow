{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>500 - خطأ في الخادم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family:'Cairo',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff0f0,#ffe8e8);margin:0; }
        .error-box { text-align:center;padding:48px;background:white;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,0.1);max-width:480px;width:90%; }
        .error-code { font-size:96px;font-weight:900;color:#ef233c;line-height:1;margin-bottom:8px; }
        .error-title { font-size:24px;font-weight:700;color:#333;margin-bottom:12px; }
        .error-msg { color:#888;font-size:14px;margin-bottom:32px; }
        .error-btn { display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:#ef233c;color:white;border-radius:12px;text-decoration:none;font-weight:600; }
    </style>
</head>
<body>
    <div class="error-box">
        <div style="font-size:48px;margin-bottom:16px;opacity:0.3;"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="error-code">500</div>
        <div class="error-title">خطأ في الخادم!</div>
        <div class="error-msg">حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى.</div>
        <a href="/dashboard/" class="error-btn"><i class="fas fa-home"></i> العودة للرئيسية</a>
    </div>
</body>
</html>
